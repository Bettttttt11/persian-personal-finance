<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>مدیریت مالی</title>
<link rel="stylesheet" href="/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="login" class="gate">
  <div class="gate-card">
    <div class="brand-mark">💰</div>
    <h1>مدیریت مالی</h1>
    <p>برای ورود، PIN را وارد کنید.</p>
    <label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <label>مدت نشست<select id="timeout"><option value="15m">۱۵ دقیقه</option><option value="30m">۳۰ دقیقه</option><option value="1h" selected>۱ ساعت</option><option value="manual">تا قفل دستی</option></select></label>
    <button id="loginBtn" class="primary wide">ورود امن</button>
    <div id="loginError" class="error"></div>
  </div>
</div>
<div id="shell" class="shell hidden">
  <header class="topbar">
    <div><small>مدیریت مالی شخصی</small><h1 id="pageTitle">خانه</h1></div>
    <button id="moreBtn" class="icon-btn" aria-label="منوی بیشتر">☰</button>
  </header>
  <main id="view" class="view"></main>
  <button id="fab" class="fab" aria-label="ثبت تراکنش">＋</button>
  <nav class="bottom-nav">
    <button data-page="home" class="active"><span>⌂</span>خانه</button>
    <button data-page="transactions"><span>≡</span>تراکنش‌ها</button>
    <button data-page="projects"><span>▦</span>پروژه‌ها</button>
    <button data-page="reports"><span>◫</span>گزارش</button>
    <button data-page="settings"><span>⚙</span>تنظیمات</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-backdrop" data-close="1"></div><section class="modal-card"><header><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn">×</button></header><div id="modalBody" class="modal-body"></div></section></div>
<div id="toast" class="toast hidden"></div>
<input id="restoreFile" class="hidden" type="file" accept=".json,.zip,application/json,application/zip">
<script type="module" src="/app.js"></script>
</body>
</html>
