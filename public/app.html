<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="color-scheme" content="dark">
<title>کیف پول من</title>
<link rel="stylesheet" href="/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="aurora aurora-a" aria-hidden="true"></div>
<div class="aurora aurora-b" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<div id="login" class="gate">
  <div class="gate-card glass">
    <div class="brand-lockup">
      <div class="brand-mark">◈</div>
      <div><small>PERSONAL FINANCE</small><h1>کیف پول من</h1></div>
    </div>
    <p id="loginText">برای ورود امن، رمز را وارد کنید.</p>
    <label id="pinField">رمز ورود<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <label>مدت نشست<select id="timeout"><option value="15m">۱۵ دقیقه</option><option value="30m">۳۰ دقیقه</option><option value="1h" selected>۱ ساعت</option><option value="manual">تا قفل دستی</option></select></label>
    <button id="loginBtn" class="primary wide">ورود امن</button>
    <div id="loginError" class="error"></div>
    <div class="gate-foot">ورود فقط از داخل Telegram و برای مالک ربات ممکن است.</div>
  </div>
</div>

<div id="shell" class="shell hidden">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="mini-logo">◈</div>
      <div><small>کیف پول من</small><h1 id="pageTitle">خانه</h1></div>
    </div>
    <button id="moreBtn" class="icon-btn" aria-label="منوی بیشتر">☰</button>
  </header>
  <main id="view" class="view"></main>
  <button id="fab" class="fab" aria-label="ثبت تراکنش"><span>＋</span></button>
  <nav class="bottom-nav" aria-label="ناوبری اصلی">
    <button data-page="home" class="active"><span>⌂</span><b>خانه</b></button>
    <button data-page="transactions"><span>≡</span><b>تراکنش‌ها</b></button>
    <button data-page="projects"><span>▦</span><b>پروژه‌ها</b></button>
    <button data-page="reports"><span>◫</span><b>گزارش</b></button>
    <button data-page="settings"><span>⚙</span><b>تنظیمات</b></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop" data-close="1"></div>
  <section class="modal-card glass" role="dialog" aria-modal="true">
    <header><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn" aria-label="بستن">×</button></header>
    <div id="modalBody" class="modal-body"></div>
  </section>
</div>
<div id="toast" class="toast hidden"></div>
<input id="restoreFile" class="hidden" type="file" accept=".json,.zip,application/json,application/zip">
<script type="module" src="/app.js"></script>
</body>
</html>
